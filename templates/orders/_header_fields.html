<div class="header-grid">
  {% for field in form %}
  <div class="field{% if field.errors %} has-error{% endif %}{% if field.name == 'property_address' or field.name == 'special_instructions' %} span2{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.name != 'special_instructions' %} <span class="req">*</span>{% endif %}</label>
    {{ field }}
    {% for e in field.errors %}<div class="error">{{ e }}</div>{% endfor %}
  </div>
  {% endfor %}
</div>
<p class="hint"><span class="req">*</span> needed before the order can be submitted. The delivery date cannot be in the past.</p>
