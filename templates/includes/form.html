{% if form.non_field_errors %}<div class="msg msg-error">{% for e in form.non_field_errors %}{{ e }}{% if not forloop.last %}<br>{% endif %}{% endfor %}</div>{% endif %}
{% for field in form %}
<div class="field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<div class="hint">{{ field.help_text|safe }}</div>{% endif %}
  {% for e in field.errors %}<div class="error">{{ e }}</div>{% endfor %}
</div>
{% endfor %}
