# Render Blueprint: creates the web service and database in one go.
# Render > New > Blueprint > pick this repository.
databases:
  - name: bfs-orders-db
    region: frankfurt
    plan: basic-256mb
    databaseName: bfs_orders
    user: bfs

services:
  - type: web
    name: bfs-orders
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py wait_for_db && python manage.py migrate --noinput
    startCommand: gunicorn bfs.wsgi --workers 2 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bfs-orders-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: EMAIL_HOST_PASSWORD
        sync: false   # entered by hand in the Render dashboard
      - key: EMAIL_HOST
        value: smtp.ionos.co.uk
      - key: EMAIL_HOST_USER
        value: materialorders@bfsuk.org
      - key: STORES_EMAIL
        value: stores@bfsuk.org

  # Daily data retention job: anonymises orders 30 days after delivery and
  # deletes drafts not saved for 30 days. Schedule is in UTC (02:15 UTC is
  # 02:15 in winter and 03:15 in summer, UK time).
  - type: cron
    name: bfs-orders-retention
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "15 2 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py wait_for_db && python manage.py run_retention
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bfs-orders-db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: bfs-orders
          envVarKey: SECRET_KEY
